name: Deploy Frontend ke GitHub Pages
on:
  push:
    branches: [main]
    paths: ['index.html', 'admin.html', 'dapur.html', 'app.js', 'admin.js', 'dapur.js', 'api.js', 'config.js', 'foodimg.js', 'favicon.svg', 'style.css', '.nojekyll', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
